name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Qt tests run without a display, as they do locally.
  QT_QPA_PLATFORM: offscreen

jobs:
  macos:
    name: macOS (Homebrew, latest OpenCV and Qt)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: brew install ninja pkgconf qt opencv zeromq cppzmq nlohmann-json googletest

      - name: Configure, build and test (debug)
        run: |
          cmake --preset debug
          cmake --build --preset debug
          ctest --preset debug

      - name: Configure, build and test (AddressSanitizer and UndefinedBehaviorSanitizer)
        run: |
          cmake --preset asan
          cmake --build --preset asan
          ctest --preset asan

  ubuntu:
    name: Ubuntu 24.04 (OpenCV 4.6, Qt 6.4)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-ubuntu-deps

      # Ubuntu's own numpy, pyzmq, pytest and black, installed with the other packages; the versions are printed
      # because they are the ones the sender is tested with.
      - name: Python sender, format and tests
        run: |
          python3 -c 'import sys, numpy, zmq, pytest; print("Python", sys.version.split()[0], "numpy", numpy.__version__, "pyzmq", zmq.__version__, "pytest", pytest.__version__)'
          black --version
          black --check python
          python3 -m pytest python/tests -q

      - name: Configure, build and test (debug)
        run: |
          cmake --preset debug
          cmake --build --preset debug
          ctest --preset debug

      - name: Build and test without Qt (proves the libraries need none)
        run: |
          cmake --preset debug -B build/no-qt -DID_VISION_LAB_BUILD_QT_APPS=OFF
          cmake --build build/no-qt
          ctest --test-dir build/no-qt --output-on-failure

      # A report, with no threshold: how much of each library, app and the examples the tests reach, as a table
      # on the run's summary page. Built with Clang, which the coverage preset needs; a test that fails under
      # it still fails the job.
      - name: Test coverage (Clang, report only)
        run: |
          CXX=clang++ scripts/coverage.sh
          {
            echo '### Test coverage (Ubuntu 24.04, Clang)'
            echo '```'
            cat build/coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows (MSVC, vcpkg, Qt 6.12.0)
    runs-on: windows-2025
    # The first run, with empty caches, builds OpenCV and FFmpeg from source.
    timeout-minutes: 120
    env:
      QT_VERSION: 6.12.0
      QT_ARCH: win64_msvc2022_64
      # aqtinstall's master at this commit, not a release: from Qt 6.11 the Windows x64 packages sit in one folder
      # per compiler (qt6_6120/qt6_6120_msvc2022_64/), which 3.3.0, the newest release, cannot find. Support
      # came with aqtinstall pull request #1000 (merged 24 March 2026); go back to a release once one has it.
      AQTINSTALL_COMMIT: 5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7
      VCPKG_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # vcpkg at the manifest's builtin-baseline: the runner's own copy is older than the baseline, which must
      # be in vcpkg's history. Full history, since vcpkg reads port versions from git objects.
      - name: Read the vcpkg baseline
        id: baseline
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          "commit=$baseline" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.baseline.outputs.commit }}
          path: vcpkg
          fetch-depth: 0
          persist-credentials: false

      # Retried: the download of vcpkg.exe from GitHub's releases sometimes times out.
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          for ($attempt = 1; ; $attempt++) {
            .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 4) { exit $LASTEXITCODE }
            Write-Host "Bootstrap attempt $attempt failed; trying again in $(30 * $attempt) seconds."
            Start-Sleep -Seconds (30 * $attempt)
          }
          "VCPKG_INSTALLATION_ROOT=${{ github.workspace }}\vcpkg" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;files,$env:VCPKG_BINARY_CACHE,readwrite" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force $env:VCPKG_BINARY_CACHE | Out-Null

      # The libraries vcpkg built before. Its file cache is keyed by each package's own inputs, so an older
      # cache still serves every package a changed vcpkg.json did not touch. Restored and saved as separate
      # steps, and saved even when the job fails: actions/cache saves only after success, so a run that
      # failed after building FFmpeg would throw it away and the next one would build it again.
      - name: Restore vcpkg's binary cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-
            vcpkg-${{ runner.os }}-

      - name: Count vcpkg's cached packages
        shell: pwsh
        run: |
          $count = @(Get-ChildItem -Recurse -File $env:VCPKG_BINARY_CACHE -ErrorAction SilentlyContinue).Count
          "VCPKG_CACHED_BEFORE=$count" >> $env:GITHUB_ENV

      # Qt's prebuilt MSVC binaries, as the Qt Online Installer gives them locally (ADR-002).
      - name: Restore Qt
        id: qt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\Qt\${{ env.QT_VERSION }}
          key: qt-${{ env.QT_VERSION }}-${{ env.QT_ARCH }}-qtmultimedia-aqt${{ env.AQTINSTALL_COMMIT }}

      - name: Install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          for ($attempt = 1; ; $attempt++) {
            pipx install --force "git+https://github.com/miurahr/aqtinstall.git@$env:AQTINSTALL_COMMIT"
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 4) { exit $LASTEXITCODE }
            Write-Host "pipx attempt $attempt failed; trying again in $(30 * $attempt) seconds."
            Start-Sleep -Seconds (30 * $attempt)
          }
          aqt install-qt windows desktop $env:QT_VERSION $env:QT_ARCH -m qtmultimedia --outputdir C:\Qt

      # Saved straight away, so a later failure in the job does not lose it.
      - name: Save Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\Qt\${{ env.QT_VERSION }}
          key: qt-${{ env.QT_VERSION }}-${{ env.QT_ARCH }}-qtmultimedia-aqt${{ env.AQTINSTALL_COMMIT }}

      - name: Point the presets at Qt
        shell: pwsh
        run: '"QT_ROOT_DIR=C:\Qt\$env:QT_VERSION\msvc2022_64" >> $env:GITHUB_ENV'

      # One step: the Visual Studio developer environment does not survive between steps.
      - name: Configure, build and test (debug)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"
          # Visual Studio's own Ninja; say so plainly if the developer environment did not provide it.
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { Write-Error "Ninja is not on PATH"; exit 1 }
          # Retried: vcpkg downloads each library's source from GitHub while configuring, and gives up after
          # three tries a second apart. A new attempt restores what the last one built from the file cache.
          # Fresh each time, so a failed attempt's cache entries (such as an unset CMAKE_MAKE_PROGRAM) go.
          for ($attempt = 1; ; $attempt++) {
            cmake --preset windows-debug --fresh
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { exit $LASTEXITCODE }
            Write-Host "Configure attempt $attempt failed; trying again in $(120 * $attempt) seconds."
            Start-Sleep -Seconds (120 * $attempt)
          }
          cmake --build --preset windows-debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --preset windows-debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The FFmpeg DLLs next to the Document Lab's programs: all five vcpkg's (cmake/ffmpeg_dlls.cmake), so
          # Qt Multimedia's plug-in never pairs them with Qt's own copies.
          Get-ChildItem build\windows-debug\apps\av*.dll, build\windows-debug\apps\sw*.dll |
            ForEach-Object { "$($_.Name): $($_.VersionInfo.ProductVersion)" }

      # Only when vcpkg added packages, so a run with nothing new does not store another copy.
      - name: Count vcpkg's cached packages again
        id: vcpkg-count
        if: always()
        shell: pwsh
        run: |
          $count = @(Get-ChildItem -Recurse -File $env:VCPKG_BINARY_CACHE -ErrorAction SilentlyContinue).Count
          "grew=$($count -gt [int]$env:VCPKG_CACHED_BEFORE)".ToLower() >> $env:GITHUB_OUTPUT

      - name: Save vcpkg's binary cache
        if: always() && steps.vcpkg-count.outputs.grew == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same clang-format as Qt Creator's, so a file formatted in the IDE passes here.
      - name: Install clang-format
        run: pipx install clang-format==22.1.8

      - name: Check formatting
        run: git ls-files -z '*.cpp' '*.h' | xargs -0 clang-format --dry-run --Werror
